<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tastenwerk – 10-Finger-Training mit Lektionen, Tempotest und Bildschirmtastatur.">
<title>Tastenwerk</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand"><b>Tastenwerk</b><span>10-Finger-Training</span></div>
  <div class="summary" id="summary"></div>
  <button class="iconbtn" id="setBtn" aria-expanded="false" aria-controls="settings">Einstellungen</button>
</header>

<div class="settings" id="settings" hidden>
  <h3>Einstellungen</h3>
  <div>
    <div class="lab">Tastaturlayout</div>
    <div class="seg" id="layoutSeg">
      <button data-l="ch">Schweiz (QWERTZ CH)</button>
      <button data-l="de">Deutschland</button>
    </div>
  </div>
  <label class="tog"><input type="checkbox" id="optBlock"><span>Bei Fehler anhalten<small>Der Cursor geht erst weiter, wenn die richtige Taste gedrückt wird.</small></span></label>
  <label class="tog"><input type="checkbox" id="optColors"><span>Fingerfarben auf der Tastatur<small>Zeigt, welcher Finger für welche Taste zuständig ist.</small></span></label>
  <label class="tog"><input type="checkbox" id="optSound"><span>Schreibmaschinenton<small>Anschlag, Fehler und Glocke am Ende.</small></span></label>
  <div><button class="danger" id="resetBtn">Fortschritt zurücksetzen</button></div>
</div>

<div class="app">
  <nav class="side" id="side" aria-label="Lektionen"></nav>
  <main>
    <section class="ctx" id="ctx"></section>
    <div class="stats" id="stats">
      <div class="stat"><small id="timeLbl">Zeit</small><b id="sTime">0:00</b></div>
      <div class="stat"><small>Anschläge/Min</small><b id="sKpm">0</b></div>
      <div class="stat"><small>Fehler</small><b id="sErr">0</b></div>
      <div class="stat"><small>Fehlerquote</small><b id="sPct">0,0 %</b></div>
      <div class="bar"><i id="sBar"></i></div>
    </div>
    <div class="sheet" id="sheet">
      <div id="text" aria-live="off"></div>
      <div class="starthint" id="starthint">Einfach lostippen · Esc startet neu</div>
      <input id="cap" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Eingabe">
      <div class="result" id="result" hidden></div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="kbd" id="kbd"></div>
    <div class="legend" id="legend"></div>
    <section class="history" id="history" hidden></section>
    <section class="history" id="chronik" hidden></section>
  </main>
</div>

</body>
</html>
