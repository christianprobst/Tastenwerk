<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tastenwerk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Courier+Prime:wght@400;700&display=swap">
<style>
body{margin:0}
/* Layout: lesson rail on the left, one working column (sheet → hint → keyboard) on the right; rail becomes a scroll strip on phones */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#17212E; --muted:#5B6878; --line:#D6DDE6;
  --accent:#1E5DBA; --accent-soft:#E1EBFA; --ok:#1C7A4B; --err:#C0352D; --err-soft:#FBE1DE;
  --key:#FFFFFF; --key-edge:#C3CCD7;
  --f-pinky:#F5D7E3; --f-ring:#FAE6C3; --f-middle:#D5ECD7; --f-index:#D4E4F9; --f-thumb:#E4E7EC;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"Courier Prime", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161E; --surface:#18212C; --ink:#E5EBF2; --muted:#98A6B6; --line:#2A3542;
  --accent:#6FA3F2; --accent-soft:#1C2C44; --ok:#5DC690; --err:#F27C73; --err-soft:#3D1F1D;
  --key:#202A36; --key-edge:#334050;
  --f-pinky:#43283A; --f-ring:#45381F; --f-middle:#213D2A; --f-index:#203450; --f-thumb:#2A323D;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161E; --surface:#18212C; --ink:#E5EBF2; --muted:#98A6B6; --line:#2A3542;
  --accent:#6FA3F2; --accent-soft:#1C2C44; --ok:#5DC690; --err:#F27C73; --err-soft:#3D1F1D;
  --key:#202A36; --key-edge:#334050;
  --f-pinky:#43283A; --f-ring:#45381F; --f-middle:#213D2A; --f-index:#203450; --f-thumb:#2A323D;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--display);font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:.85rem}
.summary{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.summary strong{color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:.9rem}
.iconbtn:hover{border-color:var(--accent)}

.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100% - 58px)}
.side{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.side h2{font-family:var(--display);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 8px 6px}
.side h2:first-child{margin-top:0}
.nav{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px}
.nav:hover{background:var(--accent-soft)}
.nav.active{background:var(--accent);color:var(--surface)}
.nav .num{font-family:var(--mono);font-weight:700;font-size:.85rem;color:var(--muted);text-align:right}
.nav.active .num{color:inherit}
.nav .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.s1{background:#D9A23A}.dots i.s2{background:#B9C7D6}.dots i.s3{background:var(--ok)}
.dots i.s1,.dots i.s2,.dots i.s3{background:var(--ok)}
.nav.active .dots i{background:color-mix(in srgb,var(--surface) 40%,transparent)}
.nav.active .dots i.s1,.nav.active .dots i.s2,.nav.active .dots i.s3{background:var(--surface)}

main{padding-block:20px 32px;padding-inline:24px;display:flex;flex-direction:column;gap:14px;max-width:1040px;width:100%;margin:0 auto;min-width:0}
.ctx{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.ctx .head{margin-right:auto;min-width:0}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.15;margin:2px 0 0;text-wrap:balance}
.newkeys{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.newkeys kbd{font-family:var(--mono);font-size:1rem;font-weight:700;border:1px solid var(--key-edge);border-bottom-width:3px;border-radius:6px;padding:0 7px;background:var(--key)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:.88rem;display:flex;align-items:center;gap:6px}
.seg button:hover{background:var(--accent-soft)}
.seg button.on{background:var(--accent);color:var(--surface)}
.seg .st{font-size:.75rem;letter-spacing:1px;color:var(--ok)}
.seg button.on .st{color:inherit}

.custom{display:flex;flex-direction:column;gap:8px;width:100%}
.custom textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit}
.custom .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:8px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:hover{filter:brightness(1.08)}
.note{color:var(--muted);font-size:.85rem}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stat{padding:10px 14px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.stat b{font-family:var(--mono);font-size:1.45rem;font-variant-numeric:tabular-nums}
.stat b.bad{color:var(--err)}
.bar{grid-column:1/-1;height:4px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}

.sheet{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 26px;cursor:text}
.sheet.shake{animation:shake .18s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#text{position:relative;font-family:var(--mono);font-size:clamp(1.15rem,2.4vw,1.6rem);line-height:2em;height:6em;overflow:hidden;white-space:pre-wrap;word-break:break-word}
#text span{border-radius:3px}
#text .ok{color:var(--muted)}
#text .miss{color:var(--err);background:var(--err-soft)}
#text .cur{background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent);animation:blink 1.1s steps(1) infinite}
#text .cur.wrong{background:var(--err-soft);box-shadow:inset 0 -3px 0 var(--err)}
@keyframes blink{50%{box-shadow:inset 0 -3px 0 transparent}}
.starthint{position:absolute;right:16px;bottom:10px;font-size:.8rem;color:var(--muted)}
#cap{position:absolute;opacity:0;width:1px;height:1px;left:0;top:0;border:0;padding:0}

.result{position:absolute;inset:0;background:var(--surface);border-radius:12px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;padding:18px 26px}
.result .verdict{min-width:0;flex:1 1 220px}
.result .stars{font-size:1.8rem;letter-spacing:4px;color:#D9A23A;line-height:1}
.result .stars .off{color:var(--line)}
.result h3{font-family:var(--display);font-size:1.3rem;margin:6px 0 2px}
.result p{margin:0;color:var(--muted);font-size:.9rem}
.result .figs{display:flex;gap:22px;font-variant-numeric:tabular-nums}
.result .figs div{display:flex;flex-direction:column}
.result .figs small{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.result .figs b{font-family:var(--mono);font-size:1.35rem}
.result .acts{display:flex;gap:8px;flex-wrap:wrap}
.result kbd{font-family:var(--mono);font-size:.75rem;opacity:.75;margin-left:4px}

.hint{display:flex;align-items:center;gap:10px;min-height:30px;font-size:.95rem}
.hint .dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--key-edge);flex:none}
.hint kbd{font-family:var(--mono);font-weight:700;border:1px solid var(--key-edge);border-bottom-width:3px;border-radius:6px;padding:0 8px;background:var(--key)}

.kbd{display:flex;flex-direction:column;gap:5px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;user-select:none}
.krow{display:flex;gap:5px}
.k{flex:1 1 0;min-width:0;height:clamp(30px,4.6vw,48px);border:1px solid var(--key-edge);border-bottom-width:3px;border-radius:7px;background:var(--key);display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:var(--mono);font-size:clamp(.62rem,1.5vw,.95rem);line-height:1.05;position:relative;transition:transform .08s,background .1s}
.k small{font-size:.75em;color:var(--muted)}
.k.fn{font-family:var(--body);font-size:clamp(.55rem,1.1vw,.75rem);color:var(--muted);align-items:flex-start;padding-left:8px}
.k.bump::after{content:"";position:absolute;bottom:5px;width:28%;height:2px;border-radius:2px;background:var(--muted)}
.k[data-f="0"],.k[data-f="9"]{background:var(--f-pinky)}
.k[data-f="1"],.k[data-f="8"]{background:var(--f-ring)}
.k[data-f="2"],.k[data-f="7"]{background:var(--f-middle)}
.k[data-f="3"],.k[data-f="6"]{background:var(--f-index)}
.k[data-f="4"]{background:var(--f-thumb)}
.k.next{background:var(--accent);color:var(--surface);border-color:var(--accent);transform:translateY(1px)}
.k.next small{color:inherit}
.k.next.bump::after{background:var(--surface)}
.kbd.plain .k:not(.next){background:var(--key)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);padding:2px 4px 0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--key-edge)}

.history{display:flex;flex-direction:column;gap:6px}
.history h2{font-family:var(--display);font-size:1rem;margin:4px 0 0}
.history table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem}
.history th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line)}
.history td{padding:6px 10px;border-bottom:1px solid var(--line)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}

.settings{position:absolute;right:16px;top:58px;z-index:10;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 12px 32px rgba(10,20,40,.18);display:flex;flex-direction:column;gap:14px}
.settings h3{font-family:var(--display);margin:0;font-size:1.05rem}
.settings label.tog{display:flex;align-items:flex-start;gap:10px;font-size:.92rem}
.settings label.tog input{margin-top:4px;accent-color:var(--accent)}
.settings label.tog span small{display:block;color:var(--muted);font-size:.8rem}
.settings .lab{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:4px}
.danger{border:1px solid var(--err);color:var(--err);background:none;border-radius:8px;padding:7px 12px;font-size:.88rem}
.danger.arm{background:var(--err);color:var(--surface)}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;padding:8px 16px;gap:4px}
  .side h2{display:none}
  .nav{width:auto;flex:none;grid-template-columns:auto auto;}
  .nav .dots{display:none}
  .nav .lbl{max-width:150px}
  main{padding-inline:16px}
  .top{padding:10px 16px}
  .brand span,.summary{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .sheet{padding:16px}
  .kbd{padding:6px;gap:3px}.krow{gap:3px}
  .k{border-radius:5px}
  .k.fn{padding-left:3px}
  .settings{top:52px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Tastenwerk</b><span>10-Finger-Training</span></div>
  <div class="summary" id="summary"></div>
  <button class="iconbtn" id="setBtn" aria-expanded="false" aria-controls="settings">Einstellungen</button>
</header>

<div class="settings" id="settings" hidden>
  <h3>Einstellungen</h3>
  <div>
    <div class="lab">Tastaturlayout</div>
    <div class="seg" id="layoutSeg">
      <button data-l="ch">Schweiz (QWERTZ CH)</button>
      <button data-l="de">Deutschland</button>
    </div>
  </div>
  <label class="tog"><input type="checkbox" id="optBlock"><span>Bei Fehler anhalten<small>Der Cursor geht erst weiter, wenn die richtige Taste gedrückt wird.</small></span></label>
  <label class="tog"><input type="checkbox" id="optColors"><span>Fingerfarben auf der Tastatur<small>Zeigt, welcher Finger für welche Taste zuständig ist.</small></span></label>
  <label class="tog"><input type="checkbox" id="optSound"><span>Schreibmaschinenton<small>Anschlag, Fehler und Glocke am Ende.</small></span></label>
  <div><button class="danger" id="resetBtn">Fortschritt zurücksetzen</button></div>
</div>

<div class="app">
  <nav class="side" id="side" aria-label="Lektionen"></nav>
  <main>
    <section class="ctx" id="ctx"></section>
    <div class="stats" id="stats">
      <div class="stat"><small id="timeLbl">Zeit</small><b id="sTime">0:00</b></div>
      <div class="stat"><small>Anschläge/Min</small><b id="sKpm">0</b></div>
      <div class="stat"><small>Fehler</small><b id="sErr">0</b></div>
      <div class="stat"><small>Fehlerquote</small><b id="sPct">0,0 %</b></div>
      <div class="bar"><i id="sBar"></i></div>
    </div>
    <div class="sheet" id="sheet">
      <div id="text" aria-live="off"></div>
      <div class="starthint" id="starthint">Einfach lostippen · Esc startet neu</div>
      <input id="cap" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Eingabe">
      <div class="result" id="result" hidden></div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="kbd" id="kbd"></div>
    <div class="legend" id="legend"></div>
    <section class="history" id="history" hidden></section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const R = n => Math.floor(Math.random() * n);
const pick = a => a[R(a.length)];

/* ---------- storage ---------- */
const store = {
  get(){ try { return JSON.parse(localStorage.getItem('tastenwerk') || '{}'); } catch(e){ return {}; } },
  set(v){ try { localStorage.setItem('tastenwerk', JSON.stringify(v)); } catch(e){} }
};
const saved = store.get();
const settings = Object.assign({layout:'ch', block:true, colors:true, sound:false}, saved.settings || {});
let results = saved.results || {};
let tempoLog = saved.tempo || [];
const persist = () => store.set({settings, results, tempo: tempoLog});

/* ---------- keyboard layouts ---------- */
const LAYOUTS = {
  ch: [
    ["§°","1+",'2"',"3*","4ç","5%","6&","7/","8(","9)","0=","'?","^`"],
    ["qQ","wW","eE","rR","tT","zZ","uU","iI","oO","pP","üè","¨!"],
    ["aA","sS","dD","fF","gG","hH","jJ","kK","lL","öé","äà","$£"],
    ["<>","yY","xX","cC","vV","bB","nN","mM",",;",".:","-_"]
  ],
  de: [
    ["^°","1!",'2"',"3§","4$","5%","6&","7/","8(","9)","0=","ß?","´`"],
    ["qQ","wW","eE","rR","tT","zZ","uU","iI","oO","pP","üÜ","+*"],
    ["aA","sS","dD","fF","gG","hH","jJ","kK","lL","öÖ","äÄ","#'"],
    ["<>","yY","xX","cC","vV","bB","nN","mM",",;",".:","-_"]
  ]
};
// 0 L-pinky, 1 L-ring, 2 L-middle, 3 L-index, 4 thumb, 6 R-index, 7 R-middle, 8 R-ring, 9 R-pinky
const ROW_FINGERS = [
  [0,0,1,2,3,3,6,6,7,8,9,9,9],
  [0,1,2,3,3,6,6,7,8,9,9,9],
  [0,1,2,3,3,6,6,7,8,9,9,9],
  [0,0,1,2,3,3,6,6,7,8,9]
];
const FINGER = ['linken kleinen Finger','linken Ringfinger','linken Mittelfinger','linken Zeigefinger','Daumen','Daumen','rechten Zeigefinger','rechten Mittelfinger','rechten Ringfinger','rechten kleinen Finger'];
const FINGER_VAR = ['--f-pinky','--f-ring','--f-middle','--f-index','--f-thumb','--f-thumb','--f-index','--f-middle','--f-ring','--f-pinky'];

let charMap = {};
function buildCharMap(){
  charMap = {' ': {space:true, finger:4}};
  LAYOUTS[settings.layout].forEach((row, r) => row.forEach((p, i) => {
    const [b, s] = [...p];
    const f = ROW_FINGERS[r][i];
    if (!charMap[b]) charMap[b] = {r, i, shift:false, finger:f};
    if (s && !charMap[s]) charMap[s] = {r, i, shift:true, finger:f};
  }));
}

function buildKeyboard(){
  const kb = $('#kbd'); kb.innerHTML = '';
  const rows = LAYOUTS[settings.layout];
  const mk = (cls, html, grow, attrs = {}) => {
    const d = document.createElement('div');
    d.className = 'k ' + cls; d.innerHTML = html; d.style.flexGrow = grow;
    for (const a in attrs) d.setAttribute(a, attrs[a]);
    return d;
  };
  const keyHtml = p => {
    const [b, s] = [...p];
    const letter = /\p{L}/u.test(b) && b.toUpperCase() === s;
    return letter ? b.toUpperCase() : `<small>${s}</small>${b}`;
  };
  const pre = [null, ['Tab', 1.5], ['Feststell', 1.8], ['⇧', 1.3, 'shiftL']];
  const post = [['⌫', 2], ['↵', 1.5], ['', 1.2], ['⇧', 2.7, 'shiftR']];
  rows.forEach((row, r) => {
    const line = document.createElement('div'); line.className = 'krow';
    if (pre[r]) line.append(mk('fn', pre[r][0], pre[r][1], pre[r][2] ? {id: pre[r][2], 'data-f': pre[r][2] === 'shiftL' ? 0 : 9} : {}));
    row.forEach((p, i) => {
      const bump = r === 2 && (i === 3 || i === 6) ? ' bump' : '';
      line.append(mk('key' + bump, keyHtml(p), 1, {id: `k-${r}-${i}`, 'data-f': ROW_FINGERS[r][i]}));
    });
    const po = post[r];
    line.append(mk('fn', po[0], po[1], po[2] ? {id: po[2], 'data-f': 9} : {}));
    kb.append(line);
  });
  const last = document.createElement('div'); last.className = 'krow';
  last.append(mk('fn', 'Strg', 1.4), mk('fn', 'Alt', 1.4), mk('', 'Leertaste', 7.2, {id: 'k-space', 'data-f': 4}), mk('fn', 'AltGr', 1.4), mk('fn', 'Strg', 1.4));
  kb.append(last);
  kb.classList.toggle('plain', !settings.colors);
}

function buildLegend(){
  const items = [['--f-pinky','kleiner Finger'],['--f-ring','Ringfinger'],['--f-middle','Mittelfinger'],['--f-index','Zeigefinger'],['--f-thumb','Daumen']];
  $('#legend').innerHTML = settings.colors ? items.map(([v, n]) => `<span><i style="background:var(${v})"></i>${n}</span>`).join('') : '';
}

/* ---------- lessons ---------- */
const DEFS = [
  {t:'Grundstellung', add:'asdfjklö'},
  {t:'E und I', add:'ei'},
  {t:'R und U', add:'ru'},
  {t:'G und H', add:'gh'},
  {t:'T und Z', add:'tz'},
  {t:'O und W', add:'ow'},
  {t:'N und C', add:'nc'},
  {t:'M und V', add:'mv'},
  {t:'Umschalttaste', shift:true},
  {t:'B und P', add:'bp'},
  {t:'Komma und Punkt', punct:',.'},
  {t:'Q, X und Y', add:'qxy'},
  {t:'Ä, Ü und ß', tCH:'Ä und Ü', add:'äü', addDE:'ß'},
  {t:'Bindestrich, Doppelpunkt, Fragezeichen', punct:'-:?'},
  {t:'Zahlen', digits:true}
];
const EX_NAMES = ['Neue Tasten','Kombinationen','Wörter','Text'];

let LESSONS = [];
function buildLessons(){
  let letters = '', punct = '', shift = false, digits = false;
  LESSONS = DEFS.map(d => {
    const add = (d.add || '') + (settings.layout === 'de' && d.addDE ? d.addDE : '');
    letters += add;
    if (d.punct) punct += d.punct;
    if (d.shift) shift = true;
    if (d.digits) digits = true;
    const kind = d.shift ? 'shift' : d.digits ? 'digits' : d.punct ? 'punct' : 'letters';
    const neu = kind === 'shift' ? [] : kind === 'digits' ? [...'1234567890'] : kind === 'punct' ? [...d.punct] : [...add];
    return {title: (settings.layout === 'ch' && d.tCH) || d.t, letters, punct, shift, digits, kind, neu};
  });
}
function allowed(L){
  const A = new Set([' ', ...L.letters, ...L.punct]);
  if (L.shift) for (const c of L.letters) { const C = c.toUpperCase(); if (C !== c && charMap[C]) A.add(C); }
  if (L.digits) for (const c of '1234567890') A.add(c);
  return A;
}

function wordPool(L){
  const A = allowed(L), out = new Set();
  for (let w of WORDS) {
    if (settings.layout === 'ch') w = w.replace(/ß/g, 'ss');
    if (!L.shift) w = w.toLowerCase();
    if ([...w].every(c => A.has(c) && charMap[c])) out.add(w);
  }
  return [...out];
}
function stream(gen, len){
  const out = []; let n = 0, guard = 0;
  while (n < len && guard++ < 400) { const t = gen(); if (!t) break; out.push(t); n += t.length + 1; }
  return out.join(' ');
}
const capFirst = w => { const C = w[0].toUpperCase(); return charMap[C] ? C + w.slice(1) : w; };

function sentences(L, pool, pref, len){
  const A = allowed(L);
  const w = () => (pref.length && Math.random() < .45) ? pick(pref) : pick(pool);
  if (!A.has('.')) return stream(w, len);
  const out = []; let n = 0;
  while (n < len) {
    const k = 4 + R(4), ws = [];
    for (let i = 0; i < k; i++) ws.push(w());
    if (L.digits && Math.random() < .6) ws.splice(1 + R(k - 1), 0, String(1 + R(250)));
    if (A.has(':') && Math.random() < .2) ws[0] += ':';
    else if (A.has(',') && k > 4 && Math.random() < .5) ws[2] += ',';
    if (A.has('-') && Math.random() < .2) { ws[k - 2] += '-' + ws[k - 1]; ws.pop(); }
    if (L.shift) ws[0] = capFirst(ws[0]);
    const s = ws.join(' ') + (A.has('?') && Math.random() < .25 ? '?' : '.');
    out.push(s); n += s.length + 1;
  }
  return out.join(' ');
}

function genExercise(L, ex){
  const letters = [...L.letters];
  const neu = L.neu.length ? L.neu : letters;
  const known = letters.filter(c => !neu.includes(c));
  const K = known.length ? known : neu;
  const syll = () => { const n = 3 + R(3); let s = ''; for (let i = 0; i < n; i++) s += Math.random() < .45 ? pick(neu) : pick(letters); return s; };
  let pool = wordPool(L);
  if (pool.length < 4) pool = Array.from({length: 20}, () => syll().replace(/[^a-zäöüß]/g, '') || 'asdf');
  const lower = [...new Set(pool.map(w => w.toLowerCase()))];
  const neuWords = pool.filter(w => neu.some(c => w.toLowerCase().includes(c)));

  if (L.kind === 'shift') {
    if (ex === 0) return stream(() => { const c = pick(letters), C = c.toUpperCase(); return charMap[C] ? C + c + c : c + c + c; }, 60);
    if (ex === 1) return stream(() => capFirst(pick(lower)), 70);
    if (ex === 2) { const caps = pool.filter(w => /^\p{Lu}/u.test(w)); return stream(() => pick(caps.length > 3 ? caps : pool), 90); }
    return sentences(L, pool, pool.filter(w => /^\p{Lu}/u.test(w)), 160);
  }
  if (L.kind === 'digits') {
    if (ex === 0) return stream(() => { const x = pick(neu), y = pick(neu); return pick([x + x + x, x + y + x, x + x + y]); }, 60);
    if (ex === 1) return stream(() => String(R(10000)), 70);
    if (ex === 2) { const nouns = pool.filter(w => /^\p{Lu}/u.test(w)); return stream(() => (2 + R(98)) + ' ' + pick(nouns.length ? nouns : pool), 90); }
    return sentences(L, pool, [], 160);
  }
  if (L.kind === 'punct') {
    const punc = (w) => {
      const p = pick(neu);
      if (p === '-') return w + '-' + pick(pool);
      return w + p;
    };
    if (ex === 0) return stream(() => { const p = pick(neu); const c = pick(K); return p === '-' ? c + '-' + c : c + c + p; }, 60);
    if (ex === 1) return stream(() => punc(pick(lower)), 70);
    if (ex === 2) return stream(() => Math.random() < .5 ? punc(pick(pool)) : pick(pool), 90);
    return sentences(L, pool, [], 160);
  }
  if (ex === 0) return stream(() => { const x = pick(neu), y = pick(K); return pick([x + x + x, x + y + x, y + x + y, x + x + y]); }, 60);
  if (ex === 1) return stream(syll, 70);
  if (ex === 2) return stream(() => (neuWords.length > 3 && Math.random() < .6) ? pick(neuWords) : pick(pool), 90);
  return sentences(L, pool, neuWords, 160);
}

function tempoText(){

/* ---------- sound ---------- */
let actx = null;
function sound(type){
  if (!settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, g = actx.createGain(); g.connect(actx.destination);
    if (type === 'bell') {
      const o = actx.createOscillator(); o.frequency.value = 1760; o.connect(g);
      g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + 1.2); o.start(t); o.stop(t + 1.2);
      return;
    }
    const len = type === 'err' ? .09 : .03;
    const buf = actx.createBuffer(1, actx.sampleRate * len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    const src = actx.createBufferSource(); src.buffer = buf;
    const f = actx.createBiquadFilter(); f.type = type === 'err' ? 'lowpass' : 'highpass'; f.frequency.value = type === 'err' ? 400 : 1800;
    src.connect(f); f.connect(g); g.gain.value = type === 'err' ? .6 : .35; src.start(t);
  } catch(e){}
}

/* ---------- typing engine ---------- */
function loadText(text){
  clearInterval(S.tick);
  Object.assign(S, {text, pos:0, errors:0, errAt:new Set(), start:0, done:false, lastTop:-1, wrongNow:false});
  const box = $('#text'); box.innerHTML = ''; box.scrollTop = 0;
  const frag = document.createDocumentFragment();
  S.spans = [...text].map(ch => { const s = document.createElement('span'); s.textContent = ch; frag.append(s); return s; });
  S.text = [...text];
  box.append(frag);
  $('#result').hidden = true;
  $('#starthint').hidden = false;
  $('#timeLbl').textContent = S.mode === 'tempo' ? 'Restzeit' : 'Zeit';
  updateStats();
  updateCursor();
}

function currentText(){
  if (S.mode === 'lesson') return genExercise(LESSONS[S.lesson], S.ex);
  if (S.mode === 'tempo') return tempoText();
  return cleanCustom(S.custom) || SAMPLE_CUSTOM;
}
function restart(){ loadText(currentText()); }

function elapsed(){ return S.start ? (performance.now() - S.start) / 1000 : 0; }
const fmtTime = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const fmtPct = p => p.toFixed(1).replace('.', ',') + ' %';
function metrics(){
  const t = S.mode === 'tempo' && S.done ? S.tempoDur : elapsed();
  const correct = S.pos - (settings.block ? 0 : [...S.errAt].length);
  const kpm = t > 0.5 ? Math.round(Math.max(0, correct) / (t / 60)) : 0;
  const pct = S.pos ? S.errors / S.pos * 100 : 0;
  return {t, kpm, pct};
}
function updateStats(){
  const m = metrics();
  $('#sTime').textContent = S.mode === 'tempo' ? fmtTime(S.tempoDur - m.t) : fmtTime(m.t);
  $('#sKpm').textContent = m.kpm;
  $('#sErr').textContent = S.errors;
  const pe = $('#sPct'); pe.textContent = fmtPct(m.pct); pe.classList.toggle('bad', m.pct > 2);
  const prog = S.mode === 'tempo' ? m.t / S.tempoDur : S.pos / S.text.length;
  $('#sBar').style.width = Math.min(100, prog * 100) + '%';
}

function updateCursor(){
  S.spans.forEach(s => s.classList.remove('cur', 'wrong'));
  const span = S.spans[S.pos];
  if (span) {
    span.classList.add('cur');
    const top = span.offsetTop;
    if (top !== S.lastTop) {
      S.lastTop = top;
      const box = $('#text'), lh = parseFloat(getComputedStyle(box).lineHeight) || 40;
      box.scrollTo({top: Math.max(0, top - lh), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
    }
  }
  highlight(S.done ? null : S.text[S.pos]);
}

function highlight(ch){
  document.querySelectorAll('.k.next').forEach(k => k.classList.remove('next'));
  const hint = $('#hint');
  if (ch == null) { hint.innerHTML = ''; return; }
  const m = charMap[ch];
  if (!m) { hint.innerHTML = `Nächstes Zeichen: <kbd>${ch}</kbd> (nicht auf dieser Tastatur)`; return; }
  if (m.space) {
    $('#k-space').classList.add('next');
    hint.innerHTML = `<span class="dot" style="background:var(--f-thumb)"></span>Leertaste mit dem Daumen`;
    return;
  }
  const el = $(`#k-${m.r}-${m.i}`); if (el) el.classList.add('next');
  let txt = `<span class="dot" style="background:var(${FINGER_VAR[m.finger]})"></span><kbd>${ch}</kbd> mit dem ${FINGER[m.finger]}`;
  if (m.shift) {
    const right = m.finger < 5;
    $(right ? '#shiftR' : '#shiftL').classList.add('next');
    txt += ` · dazu ${right ? 'rechte' : 'linke'} Umschalttaste mit dem ${right ? 'rechten' : 'linken'} kleinen Finger`;
  }
  hint.innerHTML = txt;
}

function handleChar(ch){
  if (S.done || S.pos >= S.text.length) return;
  if (!S.start) {
    S.start = performance.now();
    $('#starthint').hidden = true;
    S.tick = setInterval(() => {
      updateStats();
      if (S.mode === 'tempo' && elapsed() >= S.tempoDur) finish();
    }, 200);
  }
  const exp = S.text[S.pos];
  const span = S.spans[S.pos];
  if (ch === exp) {
    span.classList.add(S.errAt.has(S.pos) && !settings.block ? 'miss' : 'ok');
    if (S.errAt.has(S.pos)) span.classList.add('miss');
    S.pos++;
    sound('key');
    if (S.pos >= S.text.length) { finish(); return; }
  } else {
    S.errors++;
    S.errAt.add(S.pos);
    sound('err');
    const sh = $('#sheet'); sh.classList.remove('shake'); void sh.offsetWidth; sh.classList.add('shake');
    if (settings.block) {
      span.classList.add('miss');
      updateStats(); updateCursor(); span.classList.add('wrong');
      return;
    }
    span.classList.add('miss');
    S.pos++;
    if (S.pos >= S.text.length) { finish(); return; }
  }
  updateStats();
  updateCursor();
}

function finish(){
  if (S.done) return;
  S.done = true;
  clearInterval(S.tick);
  sound('bell');
  updateStats();
  updateCursor();
  const m = metrics();
  const res = $('#result');
  if (S.mode === 'lesson') {
    const stars = m.pct <= 0.5 ? 3 : m.pct <= 1 ? 2 : m.pct <= 2 ? 1 : 0;
    const k = keyOf(S.lesson, S.ex), prev = results[k];
    if (!prev || stars > prev.stars || (stars === prev.stars && m.kpm > prev.kpm)) results[k] = {stars, kpm: m.kpm, pct: m.pct, date: Date.now()};
    persist();
    const isLast = S.lesson === LESSONS.length - 1 && S.ex === 3;
    res.innerHTML = `<div class="verdict"><div class="stars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3 - stars)}</span></div>
      <h3>${stars ? 'Bestanden' : 'Noch nicht bestanden'}</h3>
      <p>${stars ? (stars === 3 ? 'Fast fehlerfrei. Weiter zur nächsten Übung.' : 'Gut gemacht. Für mehr Sterne: weniger Fehler.') : 'Zum Bestehen sind höchstens 2 % Fehler erlaubt. Lieber langsamer und genauer tippen.'}</p></div>
      <div class="figs"><div><small>A/Min</small><b>${m.kpm}</b></div><div><small>Fehler</small><b>${S.errors}</b></div><div><small>Quote</small><b>${fmtPct(m.pct)}</b></div><div><small>Zeit</small><b>${fmtTime(m.t)}</b></div></div>
      <div class="acts"><button class="btn ghost" data-act="again">Wiederholen<kbd>Esc</kbd></button>${isLast ? '' : `<button class="btn" data-act="next">${stars ? 'Nächste Übung' : 'Trotzdem weiter'}<kbd>↵</kbd></button>`}</div>`;
    renderNav(); renderCtx(); renderSummary();
  } else if (S.mode === 'tempo') {
    tempoLog.push({date: Date.now(), dur: S.tempoDur, kpm: m.kpm, pct: m.pct, layout: settings.layout});
    tempoLog = tempoLog.slice(-50);
    persist();
    res.innerHTML = `<div class="verdict"><h3>Zeit abgelaufen</h3><p>${m.kpm} Anschläge pro Minute bei ${fmtPct(m.pct)} Fehlern.</p></div>
      <div class="figs"><div><small>A/Min</small><b>${m.kpm}</b></div><div><small>Fehler</small><b>${S.errors}</b></div><div><small>Quote</small><b>${fmtPct(m.pct)}</b></div></div>
      <div class="acts"><button class="btn" data-act="again">Neuer Test<kbd>↵</kbd></button></div>`;
    renderHistory(); renderSummary();
  } else {
    res.innerHTML = `<div class="verdict"><h3>Text fertig</h3><p>${m.kpm} Anschläge pro Minute bei ${fmtPct(m.pct)} Fehlern.</p></div>
      <div class="figs"><div><small>A/Min</small><b>${m.kpm}</b></div><div><small>Fehler</small><b>${S.errors}</b></div><div><small>Zeit</small><b>${fmtTime(m.t)}</b></div></div>
      <div class="acts"><button class="btn" data-act="again">Nochmals<kbd>↵</kbd></button></div>`;
  }
  res.hidden = false;
}

function next(){
  if (S.mode !== 'lesson') { restart(); return; }
  if (S.ex < 3) S.ex++;
  else if (S.lesson < LESSONS.length - 1) { S.lesson++; S.ex = 0; }
  openLesson(S.lesson, S.ex);
}

function openLesson(l, e){
  S.mode = 'lesson'; S.lesson = l;
  S.ex = e != null ? e : Math.max(0, EX_NAMES.findIndex((_, i) => !starsOf(l, i)));
  saveNav();
  renderNav(); renderCtx(); restart();
}
function openMode(m){ S.mode = m; saveNav(); renderNav(); renderCtx(); restart(); }
function saveNav(){ saved.mode = S.mode; saved.lesson = S.lesson; try { const v = store.get(); v.mode = S.mode; v.lesson = S.lesson; v.settings = settings; v.results = results; v.tempo = tempoLog; store.set(v); } catch(e){} }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.lesson != null) openLesson(+b.dataset.lesson);
  else if (b.dataset.mode) openMode(b.dataset.mode);
  else if (b.dataset.ex != null) { S.ex = +b.dataset.ex; renderCtx(); restart(); }
  else if (b.dataset.dur) { S.tempoDur = +b.dataset.dur; renderCtx(); restart(); }
  else if (b.dataset.act === 'again') restart();
  else if (b.dataset.act === 'next') next();
  else if (b.id === 'useCustom') { S.custom = $('#customText').value; restart(); }
  if (!b.closest('#settings') && b.id !== 'setBtn') b.blur();
});

const cap = $('#cap');
$('#sheet').addEventListener('click', e => { if (!e.target.closest('button')) cap.focus({preventScroll: true}); });
cap.addEventListener('input', () => { const v = cap.value; cap.value = ''; for (const c of v) handleChar(c); });

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches && t.matches('textarea, input:not(#cap), select')) return;
  if (t.closest && t.closest('#settings')) return;
  if (!$('#settings').hidden) return;
  if (e.key === 'Escape') { e.preventDefault(); restart(); return; }
  if (S.done) { if (e.key === 'Enter' || (S.mode !== 'lesson' && e.key === ' ')) { e.preventDefault(); next(); } return; }
  if ((e.ctrlKey && !e.altKey) || e.metaKey) return;
  if (e.key.length === 1) { e.preventDefault(); handleChar(e.key); }
});

/* settings */
const setPanel = $('#settings');
$('#setBtn').addEventListener('click', () => {
  setPanel.hidden = !setPanel.hidden;
  $('#setBtn').setAttribute('aria-expanded', String(!setPanel.hidden));
  resetArm(false);
});
document.addEventListener('mousedown', e => {
  if (!setPanel.hidden && !e.target.closest('#settings') && !e.target.closest('#setBtn')) { setPanel.hidden = true; $('#setBtn').setAttribute('aria-expanded', 'false'); }
});
function syncSettingsUI(){
  document.querySelectorAll('#layoutSeg button').forEach(b => b.classList.toggle('on', b.dataset.l === settings.layout));
  $('#optBlock').checked = settings.block;
  $('#optColors').checked = settings.colors;
  $('#optSound').checked = settings.sound;
}
$('#layoutSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.l === settings.layout) return;
  settings.layout = b.dataset.l; persist(); syncSettingsUI(); applyLayout();
});
$('#optBlock').addEventListener('change', e => { settings.block = e.target.checked; persist(); restart(); });
$('#optColors').addEventListener('change', e => { settings.colors = e.target.checked; persist(); $('#kbd').classList.toggle('plain', !settings.colors); buildLegend(); });
$('#optSound').addEventListener('change', e => { settings.sound = e.target.checked; persist(); if (settings.sound) sound('key'); });
let armed = false;
function resetArm(on){ armed = on; const b = $('#resetBtn'); b.classList.toggle('arm', on); b.textContent = on ? 'Wirklich alles löschen?' : 'Fortschritt zurücksetzen'; }
$('#resetBtn').addEventListener('click', () => {
  if (!armed) { resetArm(true); return; }
  results = {}; tempoLog = []; persist(); resetArm(false);
  renderNav(); renderCtx(); renderSummary(); restart();
});

function applyLayout(){
  buildCharMap(); buildLessons(); buildKeyboard(); buildLegend();
  if (S.lesson >= LESSONS.length) S.lesson = 0;
  renderNav(); renderCtx(); renderSummary(); restart();
}

syncSettingsUI();
buildCharMap(); buildLessons(); buildKeyboard(); buildLegend();
if (S.mode === 'lesson') S.ex = Math.max(0, EX_NAMES.findIndex((_, i) => !starsOf(S.lesson, i)));
renderNav(); renderCtx(); renderSummary(); restart();
</script>
</body>
</html>
